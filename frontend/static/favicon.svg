<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.35" />
  
  <!-- Compass Needle (North) -->
  <polygon points="32,16 38,32 32,29" fill="#FFFFFF" />
  <polygon points="32,16 26,32 32,29" fill="#E0E7FF" />
  
  <!-- Compass Needle (South) -->
  <polygon points="32,48 26,32 32,35" fill="#FFFFFF" fill-opacity="0.75" />
  <polygon points="32,48 38,32 32,35" fill="#C7D2FE" />
  
  <!-- Center Pivot Pin -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="1.5" fill="#4F46E5" />
</svg>
