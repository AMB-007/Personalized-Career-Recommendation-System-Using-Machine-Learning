<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Verification Test — CareerAI</title>
  <meta name="description" content="Dynamic skill verification test with adaptive MCQs based on your selected career path." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-container"></div>

<main class="page-wrapper">
  <div class="test-wrapper">
    <div id="test-content">
      <div class="loading-state"><div class="spinner"></div><p>Loading verification questions...</p></div>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
/* ── Dynamic Skill Verification Test ── */
let questions  = [];
let currentIdx = 0;
let score      = 0;
let userAnswers = [];
let careerPath = '';

document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;
  renderNavbar('test');

  const savedCareer = localStorage.getItem('recommendedCareer') || 'General Aptitude';
  const interest    = localStorage.getItem('userInterest') || '';
  careerPath = savedCareer;

  await loadQuestions(savedCareer, interest);
});

async function loadQuestions(career, interest) {
  try {
    const res = await API.get(`/api/questions?career=${encodeURIComponent(career)}&interest=${encodeURIComponent(interest)}&limit=10`);
    if (res.status === 'success' && res.questions?.length > 0) {
      questions = res.questions.slice(0, 10);
    } else throw new Error('No questions');
  } catch {
    // Fallback static questions
    questions = [
      { id:1, question_text:'What is the output of: print(type([]))?', option_a:"<class 'tuple'>", option_b:"<class 'list'> (Correct)", option_c:"<class 'dict'>", option_d:"<class 'set'>", correct_option:'B', difficulty:'Easy', category:'Python' },
      { id:2, question_text:'Which Python keyword is used to define a generator function?', option_a:'return', option_b:'yield (Correct)', option_c:'generate', option_d:'async', correct_option:'B', difficulty:'Medium', category:'Python' },
      { id:3, question_text:'Which SQL clause filters after GROUP BY?', option_a:'WHERE', option_b:'HAVING (Correct)', option_c:'FILTER', option_d:'SELECT', correct_option:'B', difficulty:'Medium', category:'SQL' },
      { id:4, question_text:'What does the Merge Sort algorithm guarantee?', option_a:'O(N²) worst case', option_b:'O(N log N) stable (Correct)', option_c:'O(N) average', option_d:'O(log N) best', correct_option:'B', difficulty:'Hard', category:'Algorithms' },
      { id:5, question_text:'Overfitting in machine learning means?', option_a:'Model underfits training data', option_b:'Model memorizes training, poor generalization (Correct)', option_c:'Model performs well on all data', option_d:'Model has high bias', correct_option:'B', difficulty:'Easy', category:'Machine Learning' },
    ];
  }
  renderTest();
}

function renderTest() {
  const container = document.getElementById('test-content');
  container.innerHTML = `
    <div class="card card-2xl mb-4" style="background:var(--gradient-primary);border:none">
      <h2 style="color:#fff;font-size:1.5rem;font-weight:900;margin-bottom:0.25rem">Step 2: Dynamic Skill Verification Test</h2>
      <p style="color:rgba(255,255,255,0.85)">Targeting: <strong>${careerPath}</strong></p>
    </div>
    <div class="test-card" id="question-area"></div>
  `;
  showQuestion();
}

function showQuestion() {
  const q = questions[currentIdx];
  const area = document.getElementById('question-area');
  const progressPct = Math.round(((currentIdx + 1) / questions.length) * 100);

  area.innerHTML = `
    <div class="progress-bar mb-3"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="q-counter">Question ${currentIdx + 1} of ${questions.length}
      <span class="badge badge-amber ml-1">${q.difficulty || 'Medium'}</span>
      <span class="badge badge-primary ml-1">${q.category || ''}</span>
    </div>
    <div class="q-text">${q.question_text}</div>
    <div class="options-grid">
      ${['A','B','C','D'].map(letter => {
        const key = `option_${letter.toLowerCase()}`;
        const text = q[key];
        if (!text) return '';
        return `<button class="option-btn" onclick="handleAnswer('${letter}')">
          <span class="option-label">${letter}.</span> ${text}
        </button>`;
      }).join('')}
    </div>
  `;
}

function handleAnswer(selected) {
  const q = questions[currentIdx];
  const correct = q.correct_option || q.correct_answer || 'A';
  const isCorrect = selected.toUpperCase() === correct.toUpperCase();
  if (isCorrect) score++;
  userAnswers.push({ question: q.question_text, selected, isCorrect });

  currentIdx++;
  if (currentIdx < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}

async function showResults() {
  const scorePct = Math.round((score / questions.length) * 100);
  const area = document.getElementById('question-area');
  area.innerHTML = `
    <div class="text-center mb-4">
      <div style="font-size:3rem;margin-bottom:0.5rem">🎉</div>
      <h3 style="font-size:1.5rem;font-weight:900;color:var(--text-h);margin-bottom:0.5rem">Skill Verification Complete!</h3>
      <div style="display:inline-block;background:var(--gradient-primary);color:#fff;padding:0.75rem 2rem;border-radius:var(--radius-xl);font-size:2rem;font-weight:900;margin:1rem 0">
        ${score} / ${questions.length} Correct (${scorePct}%)
      </div>
    </div>
    <div id="reval-status" class="alert alert-info mb-4">⏳ Recalculating AI Recommendation with your verified score...</div>
    <div id="verified-career" class="hidden"></div>
    <div class="text-center">
      <button class="btn btn-primary btn-xl" id="finish-btn" onclick="window.location.href='/dashboard.html'" disabled>
        Proceed to Final Dashboard →
      </button>
    </div>
  `;

  // Save scores
  localStorage.setItem('verifiedScore', scorePct);

  // Re-evaluate
  try {
    const savedProfile = JSON.parse(localStorage.getItem('studentProfile') || '{}');
    const updatedProfile = { ...savedProfile, Coding_Score: scorePct, Domain_Knowledge_Score: scorePct };
    const res = await API.post('/api/predict/career', updatedProfile);
    const finalCareer = res.recommended_career_cluster || careerPath;
    localStorage.setItem('finalRecommendedCareer', finalCareer);

    document.getElementById('reval-status').innerHTML = '✅ AI model re-evaluated with your verified score!';
    document.getElementById('reval-status').className = 'alert alert-success mb-4';
    document.getElementById('verified-career').innerHTML = `
      <div class="card mb-4 text-center">
        <p style="font-weight:700;color:var(--text-muted);margin-bottom:0.5rem">Verified Recommendation:</p>
        <h4 style="font-size:1.4rem;font-weight:900;color:var(--text-link)">${finalCareer}</h4>
      </div>
    `;
    document.getElementById('verified-career').classList.remove('hidden');
  } catch {
    document.getElementById('reval-status').innerHTML = 'ℹ️ Career recommendation retained from previous assessment.';
  }

  document.getElementById('finish-btn').disabled = false;
}
</script>
</body>
</html>
