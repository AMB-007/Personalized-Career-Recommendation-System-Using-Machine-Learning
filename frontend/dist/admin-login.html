<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — CareerAI</title>
  <meta name="description" content="Admin login for CareerAI platform management." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-container"></div>

<main class="auth-page">
  <div class="auth-card fade-up">
    <div class="text-center mb-3">
      <div class="auth-icon">🛡️</div>
      <h1 style="color:var(--amber)">Admin Portal Access</h1>
      <p class="subtitle mt-1">Sign in with administrator credentials to manage the platform</p>
    </div>

    <div class="alert alert-info mb-3" style="font-size:0.82rem">
      🔑 Default: <strong>admin@gmail.com</strong> / <strong>Admin@123</strong>
    </div>

    <div id="alert-box" class="hidden"></div>

    <form id="admin-login-form" style="display:flex;flex-direction:column;gap:1.25rem">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-lg w-full" id="submit-btn"
        style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-weight:800;box-shadow:0 4px 16px rgba(245,158,11,0.4)">
        Sign In to Admin Portal
      </button>
    </form>

    <div class="auth-links">
      <p>Standard user or student? <a href="/login.html">Student Sign In</a></p>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderNavbar('admin-login');

  if (Auth.isAdmin()) { window.location.href = '/admin.html'; return; }

  document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    UI.hideAlert('alert-box');

    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    UI.setLoading('submit-btn', true, 'Authenticating Admin...', 'Sign In to Admin Portal');

    try {
      const data = await API.post('/api/auth/login', { email, password });
      if (data.token && data.user) {
        if (data.user.role === 'admin' || data.user.email?.includes('admin')) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('token', data.token);
          localStorage.setItem('userInfo', JSON.stringify(data.user));
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/admin.html';
        } else {
          UI.showAlert('alert-box', 'error', 'Access Denied: Administrator privileges required for this portal.');
        }
      } else {
        UI.showAlert('alert-box', 'error', data.error || 'Authentication failed. Please check your credentials.');
      }
    } catch {
      UI.showAlert('alert-box', 'error', 'Connection error. Make sure the backend is running.');
    } finally {
      UI.setLoading('submit-btn', false, '', 'Sign In to Admin Portal');
    }
  });
});
</script>
</body>
</html>
