<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CareerAI</title>
  <meta name="description" content="Create your free CareerAI account and start your AI career assessment journey." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-container"></div>

<main class="auth-page">
  <div class="auth-card fade-up" style="max-width:480px">
    <div class="text-center mb-3">
      <div class="auth-icon">🚀</div>
      <h1>Create Account</h1>
      <p class="subtitle mt-1">Start your AI career assessment journey</p>
    </div>

    <div id="alert-box" class="hidden"></div>

    <form id="register-form" style="display:flex;flex-direction:column;gap:1.25rem">
      <div class="form-group">
        <label for="full_name">Full Name *</label>
        <input type="text" id="full_name" name="full_name" placeholder="Your full name" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password *</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full" id="submit-btn" style="margin-top:0.5rem">
        🚀 Create Account & Start Assessment
      </button>
    </form>

    <div class="auth-links">
      <p>Already have an account? <a href="/login.html">Sign In</a></p>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderNavbar('register');

  if (Auth.isLoggedIn()) { window.location.href = '/dashboard.html'; return; }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    UI.hideAlert('alert-box');

    const full_name        = document.getElementById('full_name').value.trim();
    const email            = document.getElementById('email').value.trim().toLowerCase();
    const password         = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;

    if (password !== confirm_password) { UI.showAlert('alert-box', 'error', 'Passwords do not match'); return; }
    if (password.length < 6)           { UI.showAlert('alert-box', 'error', 'Password must be at least 6 characters'); return; }

    UI.setLoading('submit-btn', true, '⏳ Creating Account...', '🚀 Create Account & Start Assessment');

    try {
      const data = await API.post('/api/auth/register', { full_name, email, password, confirm_password });
      if (data.token && data.user) {
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('token', data.token);
        localStorage.setItem('userInfo', JSON.stringify(data.user));
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } else {
        UI.showAlert('alert-box', 'error', data.error || 'Registration failed. Please try again.');
      }
    } catch {
      UI.showAlert('alert-box', 'error', 'Connection error. Make sure the backend is running.');
    } finally {
      UI.setLoading('submit-btn', false, '', '🚀 Create Account & Start Assessment');
    }
  });
});
</script>
</body>
</html>
