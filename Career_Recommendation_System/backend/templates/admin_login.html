{% extends 'base.html' %}
{% block title %}Admin Login - Career Recommendation System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-shield-alt fa-3x text-danger mb-3"></i>
                        <h2 class="fw-bold">Admin Login</h2>
                        <p class="text-muted">Restricted access — admins only</p>
                    </div>

                    <div id="alert-box" class="d-none"></div>

                    <form id="adminLoginForm" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Admin Email</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="admin@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-danger btn-lg w-100 fw-semibold">
                            <span id="btnText">Sign In as Admin</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        <a href="/" class="text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Back to Home</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const spinner = document.getElementById('btnSpinner');

    btn.disabled = true;
    spinner.classList.remove('d-none');

    try {
        const formData = new FormData(this);
        const response = await fetch('/admin/login', { method: 'POST', body: formData });
        const data = await response.json();

        if (data.success) {
            showAlert('Login successful! Redirecting...', 'success');
            setTimeout(() => window.location.href = data.redirect || '/admin/dashboard', 1000);
        } else {
            showAlert(data.message || (data.errors ? data.errors.join('<br>') : 'Login failed.'), 'danger');
        }
    } catch (err) {
        showAlert('An unexpected error occurred.', 'danger');
    } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
    }
});

function showAlert(message, type) {
    const alertBox = document.getElementById('alert-box');
    alertBox.className = `alert alert-${type}`;
    alertBox.innerHTML = message;
    alertBox.classList.remove('d-none');
}
</script>
{% endblock %}
