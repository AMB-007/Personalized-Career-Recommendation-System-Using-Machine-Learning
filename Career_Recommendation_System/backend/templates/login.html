{% extends "base.html" %}
{% block title %}Login — Career Recommendation System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-circle mb-3"
                     style="width:60px;height:60px;">
                    <i class="fas fa-user-circle fa-2x text-white"></i>
                </div>
                <h4 class="fw-bold mb-1">Welcome Back</h4>
                <p class="text-muted small">Sign in to your account</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div id="error-alert" class="alert alert-danger d-none"></div>
                    <div id="success-alert" class="alert alert-success d-none"></div>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-envelope text-muted small"></i>
                                </span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email"
                                       placeholder="you@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-lock text-muted small"></i>
                                </span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password"
                                       placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                                    <i class="fas fa-eye small"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                            <span id="loginText"><i class="fas fa-sign-in-alt me-2"></i>Sign In</span>
                            <span id="loginSpinner" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
                            </span>
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-center mt-3 text-muted small">
                Don't have an account? <a href="/register" class="fw-semibold">Create one</a>
            </p>

        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const icon = this.querySelector('i');
    if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fas fa-eye-slash small'; }
    else { pwd.type = 'password'; icon.className = 'fas fa-eye small'; }
});

document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errDiv = document.getElementById('error-alert');
    const sucDiv = document.getElementById('success-alert');
    errDiv.classList.add('d-none');
    sucDiv.classList.add('d-none');

    document.getElementById('loginText').classList.add('d-none');
    document.getElementById('loginSpinner').classList.remove('d-none');
    btn.disabled = true;

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
            sucDiv.textContent = 'Login successful! Redirecting...';
            sucDiv.classList.remove('d-none');
            setTimeout(() => window.location.href = data.redirect || '/dashboard', 600);
        } else {
            errDiv.textContent = data.message || 'Invalid credentials';
            errDiv.classList.remove('d-none');
        }
    } catch (err) {
        errDiv.textContent = 'An error occurred. Please try again.';
        errDiv.classList.remove('d-none');
    } finally {
        document.getElementById('loginText').classList.remove('d-none');
        document.getElementById('loginSpinner').classList.add('d-none');
        btn.disabled = false;
    }
});
</script>
{% endblock %}
